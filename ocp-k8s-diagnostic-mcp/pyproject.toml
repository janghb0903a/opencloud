[project]
name = "ocp-k8s-diagnostic-mcp"
version = "0.1.0"
description = "Read-only Kubernetes diagnostic MCP server for internal Claude Code usage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "kubernetes>=29.0.0",
  "mcp>=1.9.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
ocp-k8s-diagnostic-mcp = "ocp_k8s_diagnostic_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

