{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ocp-k8s-diagnostic-mcp.fullname" . }}-readonly
  labels:
    {{- include "ocp-k8s-diagnostic-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "pods/log", "events", "persistentvolumeclaims", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ocp-k8s-diagnostic-mcp.fullname" . }}-readonly
  labels:
    {{- include "ocp-k8s-diagnostic-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ocp-k8s-diagnostic-mcp.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "ocp-k8s-diagnostic-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

