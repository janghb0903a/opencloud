{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ocp-k8s-diagnostic-mcp.fullname" . }}-env
  labels:
    {{- include "ocp-k8s-diagnostic-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}

