services:
  backend:
    image: grafana-ai-assistant-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "8000:8000"
    env_file:
      - ./.env.example
    environment:
      APP_VERSION: ${APP_VERSION:-dev}

  frontend:
    image: grafana-ai-assistant-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ""
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      - backend